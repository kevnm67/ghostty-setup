# actions/labeler@v5 format: each label maps to a list of match conditions.
ci:
  - changed-files:
      - any-glob-to-any-file: .github/**

docs:
  - changed-files:
      - any-glob-to-any-file: "*.md"

ghostty:
  - changed-files:
      - any-glob-to-any-file: ghostty/**

tmux:
  - changed-files:
      - any-glob-to-any-file: tmux/**

scripts:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**
          - Makefile
