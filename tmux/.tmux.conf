# ─── Prefix ───────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ─── General ──────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -sg escape-time 0
set -g focus-events on
set -g mouse on
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#S:#I #{b:pane_current_path} (#{pane_current_command})"
set -g update-environment "TERM TERM_PROGRAM DISPLAY SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY LANG LC_ALL"

# ─── Scroll ───────────────────────────────────────────────
bind -n WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "copy-mode -e; send-keys -M"

# ─── Pane Navigation ─────────────────────────────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Splits ───────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind < swap-pane -U
bind > swap-pane -D
bind S setw synchronize-panes \; display "Sync #{?synchronize-panes,ON,OFF}"
bind ! break-pane
bind @ choose-window "join-pane -h -s '%%'"

# ─── Pane Visuals ─────────────────────────────────────────
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g pane-border-lines heavy
set -g pane-border-style "fg=#7f849c"
set -g pane-active-border-style "fg=#52b87a,bold"
set -g pane-border-status top
set -g pane-border-format "#[fill=#3d3b42] #(~/.tmux/pane-label.sh '#{pane_index}' '#{pane_current_path}' '#{pane_current_command}' '#{pane_active}')#[bg=#3d3b42] "
set -g display-panes-time 1500
set -g display-panes-colour "#45475a"
set -g display-panes-active-colour "#ad95e9"

# ─── Windows ──────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# ─── Keys ─────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "pbcopy"

# ─── Layouts ──────────────────────────────────────────────
bind = select-layout tiled \; display "Rebalanced"
bind + select-layout main-vertical \; run "tmux resize-pane -t 1 -x '60%'" \; display "60/40"
set-hook -g after-kill-pane "select-layout tiled"
set-hook -g pane-exited "select-layout tiled"

# ─── Claude Agent Layouts ─────────────────────────────────
bind T new-window -n "claude-team" -c "#{pane_current_path}" \; \
  select-pane -P 'bg=#322640' \; send-keys "claude" Enter \; \
  split-window -h -c "#{pane_current_path}" \; \
  select-pane -P 'bg=#1e3228' \; send-keys "claude" Enter \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-pane -P 'bg=#32281e' \; send-keys "claude" Enter \; \
  select-pane -t 1 \; select-layout main-vertical

bind Q new-window -n "claude-squad" -c "#{pane_current_path}" \; \
  select-pane -P 'bg=#322640' \; send-keys "claude" Enter \; \
  split-window -h -p 50 -c "#{pane_current_path}" \; \
  select-pane -P 'bg=#1e3228' \; send-keys "claude" Enter \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-pane -P 'bg=#32281e' \; send-keys "claude" Enter \; \
  split-window -v -c "#{pane_current_path}" \; \
  select-pane -P 'bg=#1e2838' \; send-keys "claude" Enter \; \
  select-pane -t 1 \; select-layout main-vertical

bind C split-window -h -c "#{pane_current_path}" \; \
  send-keys "claude" Enter \; select-pane -P 'bg=#1e3228'

bind P run-shell '\
  i=0; for p in $(tmux list-panes -F "#{pane_id}"); do \
    case $i in \
      0) tmux select-pane -t $p -P "bg=#322640" ;; \
      1) tmux select-pane -t $p -P "bg=#1e3228" ;; \
      2) tmux select-pane -t $p -P "bg=#32281e" ;; \
      3) tmux select-pane -t $p -P "bg=#1e2838" ;; \
      *) tmux select-pane -t $p -P "bg=#301e28" ;; \
    esac; i=$((i+1)); done' \; display "Pane colors applied"

# ─── Yazi ─────────────────────────────────────────────────
bind f split-window -h -c "#{pane_current_path}" "~/.config/ghostty/yazi-launch.sh"
bind F send-keys "~/.config/ghostty/yazi-launch.sh" Enter

# ─── Status Bar ───────────────────────────────────────────
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=#cdd6f4"
set -g status-left-length 30
set -g status-left "#[bg=#ad95e9,fg=#28262b,bold] #S #[default] "
set -g status-right-length 120
set -g status-right "#{?synchronize-panes,#[bg=#f57f6c,fg=#28262b,bold] SYNC ,}#[fg=#d99530]#(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '-')#[fg=#6c7086]@#[fg=#52b87a]#{b:pane_current_path} #[fg=#7fb6ed]%a %b %d #[fg=#f88aaf,bold]%H:%M "
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"
set -g window-status-format "#[bg=#3d3b42,fg=#6c7086] #I #[fg=#cdd6f4]#{b:pane_current_path} #[fg=#7f849c]#{pane_current_command} #[default]"
set -g window-status-current-format "#[bg=#52b87a,fg=#28262b,bold]  #I  #{b:pane_current_path}  #{pane_current_command}  #[default]"
set -g window-status-separator "#[fg=#45475a] | "

# ─── Plugins (TPM) ────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
