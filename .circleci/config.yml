version: "2.1"

# ghostty-setup CI — shellcheck + pre-commit
# No secrets required — no context needed

orbs:
  shellcheck: circleci/shellcheck@3.4.0

jobs:
  pre_commit:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - restore_cache:
          keys:
            - pre-commit-v1-{{ checksum ".pre-commit-config.yaml" }}
      - run:
          name: Install pre-commit
          command: pip install pre-commit --quiet
      - run:
          name: Run pre-commit
          command: pre-commit run --all-files
      - save_cache:
          key: pre-commit-v1-{{ checksum ".pre-commit-config.yaml" }}
          paths:
            - ~/.cache/pre-commit

workflows:
  pr_workflow:
    jobs:
      - shellcheck/check:
          severity: warning
          filters:
            branches:
              ignore: main
      - pre_commit:
          filters:
            branches:
              ignore: main

  main_workflow:
    jobs:
      - shellcheck/check:
          severity: warning
          filters:
            branches:
              only: main
      - pre_commit:
          filters:
            branches:
              only: main
