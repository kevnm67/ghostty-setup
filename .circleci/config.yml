version: "2.1"

# ghostty-setup CI
# Contexts: circleci-agents (GITHUB_TOKEN with contents:write)
# Deploy: main_workflow → CI passes → approve-deploy (hold) → tag_release → release_workflow

orbs:
  shellcheck: circleci/shellcheck@3.4.0
  gh: circleci/github-cli@2.7.2

jobs:
  pre_commit:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - restore_cache:
          keys:
            - pre-commit-v1-{{ checksum ".pre-commit-config.yaml" }}
      - run:
          name: Install pre-commit
          command: pip install pre-commit --quiet
      - run:
          name: Run pre-commit
          command: pre-commit run --all-files
      - save_cache:
          key: pre-commit-v1-{{ checksum ".pre-commit-config.yaml" }}
          paths:
            - ~/.cache/pre-commit

  tag_release:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - gh/setup
      - run:
          name: Tag and push release
          command: .circleci/scripts/tag_release.sh

  release:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - gh/setup
      - run:
          name: Create GitHub release
          command: gh release create "$CIRCLE_TAG" --generate-notes --latest

workflows:
  pr_workflow:
    jobs:
      - shellcheck/check:
          severity: warning
          filters:
            branches:
              ignore: main
      - pre_commit:
          filters:
            branches:
              ignore: main

  main_workflow:
    jobs:
      - shellcheck/check:
          severity: warning
          filters:
            branches:
              only: main
      - pre_commit:
          filters:
            branches:
              only: main
      - approve-deploy:
          type: approval
          requires:
            - shellcheck/check
            - pre_commit
          filters:
            branches:
              only: main
      - tag_release:
          context: circleci-agents
          requires:
            - approve-deploy
          filters:
            branches:
              only: main

  release_workflow:
    jobs:
      - release:
          context: circleci-agents
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
