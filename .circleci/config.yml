version: "2.1"

# ghostty-setup CI
# Contexts: circleci-agents (requires GITHUB_TOKEN with contents:write for releases)

orbs:
  shellcheck: circleci/shellcheck@3.4.0

jobs:
  pre_commit:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - restore_cache:
          keys:
            - pre-commit-v1-{{ checksum ".pre-commit-config.yaml" }}
      - run:
          name: Install pre-commit
          command: pip install pre-commit --quiet
      - run:
          name: Run pre-commit
          command: pre-commit run --all-files
      - save_cache:
          key: pre-commit-v1-{{ checksum ".pre-commit-config.yaml" }}
          paths:
            - ~/.cache/pre-commit

  release:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Create GitHub release
          command: |
            curl -sf -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/kevnm67/ghostty-setup/releases" \
              -d "{\"tag_name\":\"${CIRCLE_TAG}\",\"generate_release_notes\":true,\"make_latest\":true}"

workflows:
  pr_workflow:
    jobs:
      - shellcheck/check:
          severity: warning
          filters:
            branches:
              ignore: main
      - pre_commit:
          filters:
            branches:
              ignore: main

  main_workflow:
    jobs:
      - shellcheck/check:
          severity: warning
          filters:
            branches:
              only: main
      - pre_commit:
          filters:
            branches:
              only: main

  release_workflow:
    jobs:
      - release:
          context: circleci-agents
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
